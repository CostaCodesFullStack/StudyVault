services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: studyvault
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina no .env}
      POSTGRES_DB: studyvault
    ports: ["127.0.0.1:5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studyvault"]
      interval: 5s
      retries: 10
  app:
    build: .
    profiles: ["app"] # docker compose --profile app up -d --build
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://studyvault:${POSTGRES_PASSWORD}@db:5432/studyvault
      AUTH_SECRET: ${AUTH_SECRET:?defina no .env}
      STORAGE_PROVIDER: local
      STORAGE_LOCAL_PATH: /app/storage
    ports: ["3000:3000"]
    volumes: [storage:/app/storage]
volumes:
  pgdata:
  storage:
